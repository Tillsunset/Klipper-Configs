[force_move]
enable_force_move: True

[homing_override]
gcode:
  FORCE_MOVE STEPPER=stepper_x DISTANCE=-105 VELOCITY=10 ACCEL=1500
  FORCE_MOVE STEPPER=stepper_y DISTANCE=-105 VELOCITY=10 ACCEL=1500
  FORCE_MOVE STEPPER=stepper_z DISTANCE=-105 VELOCITY=10 ACCEL=100
  SetPosZero
axes: xyz

[gcode_macro SetPosZero]
gcode:
    set_kinematic_position x=0 y=0 z=0
