
[include fluidd.cfg]
[include macros.cfg]
[include homing_override.cfg]
[include buttons.cfg]

[mcu]
serial: /dev/serial/by-path/pci-0000:00:15.0-usb-0:4:1.0-port0
restart_method: command

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[printer]
kinematics: cartesian
max_velocity: 60
max_accel: 1500
max_z_velocity:10
max_z_accel:200
minimum_cruise_ratio: 0.25

[stepper_x]
step_pin: PC6
dir_pin: !PB12
enable_pin: !PB10
endstop_pin: PC13
microsteps: 16
rotation_distance: 28
position_endstop: 0
position_max: 100
homing_speed: 10

[stepper_y]
step_pin: PB11
dir_pin: !PB2
enable_pin: !PB10
endstop_pin: PC0
microsteps: 16
rotation_distance: 28
position_endstop: 0
position_max: 100
homing_speed: 10

[stepper_z]
step_pin: PB1
dir_pin: !PC5
enable_pin: !PB10
endstop_pin: !PC12
microsteps: 16
full_steps_per_rotation: 32
rotation_distance: 28
gear_ratio: 33:1
position_min: -5
position_endstop: 0
position_max: 100
homing_speed: 10

[extruder]
step_pin: PC4
dir_pin: !PA5
enable_pin: !PA4
# enable_pin: PA4 # disable
microsteps: 16
rotation_distance: 2.9
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 5
max_extrude_only_distance: 500
pressure_advance: 0.075
heater_pin: PC9
max_power: 0.75
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
#pid_Kp: 14.669
#pid_Ki: 0.572
#pid_Kd: 94.068
min_temp: -250
max_temp: 230
min_extrude_temp: -100

#####################################################################
#   G-Code features
#####################################################################
[skew_correction]
#SET_SKEW XY=3.484,3.499,2.458 XZ=2.751,2.805,1.969

[exclude_object]

[heater_fan hotend_fan]
pin: PA8
fan_speed: 0.90

