# This file contains pin mappings and other defaults for the Weefun/Weedo
# Tina2s based on the GD32F103. It won't work with the ATMega-bsed
# Tina/Tina wifi/monoprice cadet.

# The biggest issue with this printer is that the USB-serial CH340G's DTR pin
# is tied to reset with a 1k resistor - not a capacitor circuit like most.
# restart_method of 'tina2s' was added to make sure DTR is held high during
# normal operation

# Pins were found in https://github.com/weedo3d/TINA2Sfirmware and confirmed
# on hardware. Flashing will not work with stm32flash or via makefile because
# of the DTR implementaiton. It can be flashed using the proprietary upload
# tool found in their repository. Factory firmware can be reverted with the
# same tool

# menuconfig options:
# [*] Enable extra low-level configuration options
#     Micro-controller Architecture (STMicroelectronics STM32)  --->
#     Processor model (STM32F103)  --->
# [ ] Only 10KiB of RAM (for rare stm32f103x6 variant) (NEW)
# [ ] Disable SWD at startup (for GigaDevice stm32f103 clones) (NEW)
#     Bootloader offset (32KiB bootloader)  --->
#     Clock Reference (8 MHz crystal)  --->
#     Communication interface (Serial (on USART1 PA10/PA9))  --->
# (115200) Baud rate for serial port
# ()  GPIO pins to set at micro-controller startup (NEW)

[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 2000
max_z_velocity: 20
max_z_accel: 400

[stepper_x]
step_pin: PB8
dir_pin: PB7
enable_pin: !PB9
microsteps: 16
rotation_distance: 32
endstop_pin: ^PA7
position_endstop: 105
position_max: 105

[stepper_y]
step_pin: PA12
dir_pin: !PA11
enable_pin: !PA15
microsteps: 16
rotation_distance: 32
endstop_pin: ^!PC4
position_endstop: 0
position_min: 0
position_max: 105

[stepper_z]
step_pin: PC7
dir_pin: PC6
enable_pin: !PA8
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 100

[extruder]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
microsteps: 16
max_extrude_only_distance: 100.0
rotation_distance: 31.33
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.55
heater_pin: PC14
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
control: pid
pid_Kp: 35.983
pid_Ki: 2.499
pid_Kd: 129.539
min_temp: 0
max_temp: 250

[heater_fan Hotend_fan]
pin: PC15

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
control: pid
pid_Kp: 70.383
pid_Ki: 4.837
pid_Kd: 256.017
min_temp: 0
max_temp: 120

[probe]
pin: !PC13
x_offset: 28
y_offset: 2
z_offset: 5

[bed_mesh]
mesh_min: 28, 14
mesh_max: 100, 95

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 115200
restart_method: tina2s

[display]
lcd_type: uc1701
cs_pin: PB12
a0_pin: PC2
rst_pin: PB11
encoder_pins: ^PC3, ^PA1
click_pin: ^!PA4

